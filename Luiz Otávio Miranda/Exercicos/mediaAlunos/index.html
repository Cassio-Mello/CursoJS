<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média de Alunos</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <section class="container">
        <h1>Média de Alunos</h1>

        <form class="form-notas">
            <label for="nome-aluno">Nome do aluno:</label>
            <input type="text" id="nome-aluno" placeholder="Insira o nome do aluno">

            <label for="nota-aluno">Nota do aluno:</label>
            <input type="number" id="nota-aluno" placeholder="Insira a nota do aluno" min="0" max="10" step="0.1">

            <button type="button" id="adicionar-nota">Adicionar nota</button>
            <button type="button" id="calcular-media">Calcular média</button>
        </form>

        <div id="resultado"></div>
    </section>

    <script src="./assets/js/main.js"></script>
</body>
</html>
